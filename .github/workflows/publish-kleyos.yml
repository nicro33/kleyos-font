name: Publish Kleyos payload
on:
  push:
    paths:
      - '.release-payload/*.gz.b64'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check payload
        id: check
        run: |
          if [ -f .release-payload/display.ttf.gz.b64 ] && [ -f .release-payload/text.ttf.gz.b64 ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: Build release fonts
        if: steps.check.outputs.ready == 'yes'
        run: |
          mkdir -p fonts/ttf fonts/woff2
          base64 -d .release-payload/display.ttf.gz.b64 | gunzip > fonts/ttf/Kleyos-Display.ttf
          base64 -d .release-payload/text.ttf.gz.b64 | gunzip > fonts/ttf/Kleyos-Text.ttf
          python -m pip install --quiet fonttools brotli
          python - <<'PY'
          from fontTools.ttLib import TTFont
          for role in ["Display","Text"]:
              f=TTFont(f"fonts/ttf/Kleyos-{role}.ttf")
              f.flavor="woff2"
              f.save(f"fonts/woff2/Kleyos-{role}.woff2")
          PY
          sha256sum fonts/ttf/* fonts/woff2/* > SHA256SUMS.txt
          rm -rf .release-payload
      - name: Commit published version
        if: steps.check.outputs.ready == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts SHA256SUMS.txt .release-payload
          git commit -m "Publish Kleyos 1.1.0 (H2-i25b balanced)" || exit 0
          git push
