<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kleyos specimen</title>
<link rel="stylesheet" href="../../css/kleyos-regular.css">
<style>
  * { box-sizing: border-box; }
  :root { color: #1e403a; background: #f2ebda; }
  body { margin: 0; font: 16px system-ui, sans-serif; }
  main { max-width: 1120px; margin: auto; padding: 40px 60px; }
  header, section { border-bottom: 1px solid #bcb49f; }
  h1 { margin: 4px 0 18px; font-size: clamp(64px, 12vw, 136px); font-weight: 400; line-height: 1; }
  p { margin: 0 0 18px; }
  .label { font-size: 13px; color: #564f41; }
  .samples { padding: 26px 0 12px; }
  .samples p { font-size: clamp(26px, 4.2vw, 45px); line-height: 1.26; }
  .glyphs { padding: 24px 0 0; color: #824634; font-size: 35px; line-height: 1.4; }
  @media (max-width: 600px) { main { padding: 28px; } }
</style>
<main>
  <header>
    <p class="label">Nicolas Gros · Regular · 1.3.0</p>
    <h1 class="kleyos">Kleyos</h1>
  </header>
  <section class="samples kleyos">
    <p lang="fr">Écouter le vent et laisser venir les mots.</p>
    <p lang="en">A quiet moment at the edge of the world.</p>
    <p lang="de">Über den Hügel führt ein schmaler Weg.</p>
  </section>
  <p class="kleyos glyphs">À É Œ ß Ü Č Ř Ž · 0123456789<br> € + $ &amp; — / % { } ˇ ˘ −</p>
</main>
</html>
