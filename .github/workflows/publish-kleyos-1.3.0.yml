name: Publish Kleyos 1.3.0
on:
  push:
    branches: ['release/publish-kleyos-1.3.0']

permissions: {}
concurrency:
  group: kleyos-1.3.0-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nicro33/kleyos-font'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      RELEASE_TARGET: 52c4181b27b90c1e428a6dec9f96bc4c3f944feb
      RELEASE_TAG: v1.3.0
      ARCHIVE: Kleyos-1.3.0-Public-Release-RFN.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52c4181b27b90c1e428a6dec9f96bc4c3f944feb
          persist-credentials: false
      - name: Verify the exact release commit and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET"
          (cd dist && sha256sum --strict -c "$ARCHIVE.sha256")
          unzip -q "dist/$ARCHIVE" -d "$RUNNER_TEMP/verified"
          (cd "$RUNNER_TEMP/verified/Kleyos-1.3.0" && sha256sum --strict -c SHA256SUMS.txt)
          cmp "$RUNNER_TEMP/verified/Kleyos-1.3.0/manifest.json" manifest.json
      - name: Publish verified GitHub Release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_refs=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [[ -n "$tag_refs" ]]; then
            tag_commit=$(printf '%s\n' "$tag_refs" | tail -n1 | cut -f1)
            test "$tag_commit" = "$RELEASE_TARGET"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
            cmp "$RUNNER_TEMP/release/$ARCHIVE.sha256" "dist/$ARCHIVE.sha256"
            (cd "$RUNNER_TEMP/release" && sha256sum --strict -c "$ARCHIVE.sha256")
            exit 0
          fi
          gh release create "$RELEASE_TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title "Kleyos 1.3.0" \
            --notes-file documentation/RELEASE-1.3.0.md
